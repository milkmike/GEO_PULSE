name: Feature branch CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: geopulse_test
          POSTGRES_USER: geopulse
          POSTGRES_PASSWORD: geopulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geopulse -d geopulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GEO_PULSE_SEARCH_PERF_TEST_DATABASE_URL: postgresql+psycopg2://geopulse:geopulse@127.0.0.1:5432/geopulse_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-api.txt \
            -r requirements-collector.txt \
            -r requirements-analyzer.txt \
            -r requirements-temperature.txt \
            -r requirements-dev.txt

      - name: Enable PostgreSQL extensions
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1 -U geopulse -d geopulse_test
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run backend test suite
        run: python -m pytest -q -ra

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      FEATURE_SEARCH_NAVIGATION: "true"
      FEATURE_STORIES_NAVIGATION: "true"
      FEATURE_INVESTIGATION: "true"
      FEATURE_SIGNAL_DETAIL: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
