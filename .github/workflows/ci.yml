name: Feature branch CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: geopulse
          POSTGRES_PASSWORD: geopulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geopulse -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: geopulse
      PGPASSWORD: geopulse
      GEO_PULSE_TEST_DATABASE_URL: postgresql://geopulse:geopulse@127.0.0.1:5432/geopulse_migrations_test
      GEO_PULSE_TEST_DATABASE_RESET: "1"
      GEO_PULSE_SEARCH_PERF_TEST_DATABASE_URL: postgresql://geopulse:geopulse@127.0.0.1:5432/geopulse_search_test
      GEOPULSE_STORY_MVCC_TEST_DATABASE_URL: postgresql://geopulse:geopulse@127.0.0.1:5432/geopulse_story_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-api.txt \
            -r requirements-collector.txt \
            -r requirements-analyzer.txt \
            -r requirements-temperature.txt \
            -r requirements-dev.txt

      - name: Create isolated PostgreSQL test databases
        run: |
          psql --dbname=postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE geopulse_migrations_test"
          psql --dbname=postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE geopulse_search_test"
          psql --dbname=postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE geopulse_story_test"
          psql --dbname=geopulse_search_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Verify live PostgreSQL gate configuration
        run: |
          command -v psql
          test "$(psql "$GEO_PULSE_TEST_DATABASE_URL" -Atqc "SELECT current_database()")" = "geopulse_migrations_test"
          test "$(psql "$GEO_PULSE_SEARCH_PERF_TEST_DATABASE_URL" -Atqc "SELECT current_database()")" = "geopulse_search_test"
          test "$(psql "$GEOPULSE_STORY_MVCC_TEST_DATABASE_URL" -Atqc "SELECT current_database()")" = "geopulse_story_test"

      - name: Run live PostgreSQL gates
        run: >-
          python -m pytest -q -ra
          tests/test_postgres_migrations.py
          tests/test_search_postgres.py
          tests/test_story_membership_mvcc.py

      - name: Run remaining backend test suite
        run: >-
          python -m pytest -q -ra
          --ignore=tests/test_postgres_migrations.py
          --ignore=tests/test_search_postgres.py
          --ignore=tests/test_story_membership_mvcc.py

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      FEATURE_SEARCH_NAVIGATION: "true"
      FEATURE_STORIES_NAVIGATION: "true"
      FEATURE_INVESTIGATION: "true"
      FEATURE_SIGNAL_DETAIL: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
